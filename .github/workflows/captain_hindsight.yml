name: Harry Hindsight

# The Chief Sceptic. Reads Bob / Sally / Wally / Theo outputs already in the
# repo, gates deterministically, and only calls the model when a gate fires.
# Emails a Bob-style card per report with the full analysis as a PDF attachment.
#
# Personal data (case files, SQLite, reports, bias profile) lives in a
# PRIVATE repo, checked out next to this one and committed back after the
# run. This repo is public: nothing personal is committed here, and the run
# logs print counts and statuses only.
#
# Setup (see hindsight/README.md):
#   - create JohnnyM77/Reporting-Agent-private (private)
#   - secret HINDSIGHT_PRIVATE_REPO_TOKEN: fine-grained token, contents read/write on it
#   - repo variable HINDSIGHT_STORE: private_repo (default) or local (no persistence)
# With private_repo selected and no token, the checkout step fails loudly.
# That is deliberate: there is no silent fallback to a tracked path.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "daily (triage + events), sell (one holding), portfolio, autopsy, scorecard"
        type: choice
        options: [daily, sell, portfolio, autopsy, scorecard]
        default: daily
      ticker:
        description: "For mode=sell: the holding to review, e.g. NHC"
        required: false
        default: ""
      force:
        description: "Re-run even if this event was already reviewed"
        type: boolean
        default: false
      store:
        description: "Where case files go. default = repo variable HINDSIGHT_STORE, else private_repo. local = throwaway store on the runner (emails, keeps nothing)."
        type: choice
        options: [default, private_repo, local]
        default: default
  # Runs after the agents it reads, not on its own clock. Bob runs daily
  # (plus a catch-up cron), Wally on Fridays, Sally on Sundays. Hindsight's
  # JM triage runs at most once a day; later runs only review new events, and
  # already-reviewed events are skipped, so a second trigger costs nothing.
  # workflow_run only fires for workflows on the default branch.
  workflow_run:
    workflows:
      - Daily Announcement Digest
      - Wally Watchlist Screening
      - Selling Sally Weekly Review
    types: [completed]

concurrency:
  group: captain-hindsight
  cancel-in-progress: false

jobs:
  hindsight:
    runs-on: ubuntu-latest
    permissions:
      # write: the run commits docs/data/harry.json + the rebuilt dashboard
      contents: write
    env:
      HINDSIGHT_STORE: ${{ (inputs.store && inputs.store != 'default') && inputs.store || vars.HINDSIGHT_STORE || 'private_repo' }}
    steps:
      - name: Check out repo (full history, for thesis versions and Sally's flag streak)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml pydantic anthropic yfinance pandas openpyxl weasyprint

      - name: Check out private store
        if: env.HINDSIGHT_STORE == 'private_repo'
        uses: actions/checkout@v4
        with:
          repository: JohnnyM77/Reporting-Agent-private
          token: ${{ secrets.HINDSIGHT_PRIVATE_REPO_TOKEN }}
          path: hindsight_private

      - name: Run Harry Hindsight
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-4-6
          HINDSIGHT_MAX_LLM_CALLS: "10"
          HINDSIGHT_MAX_TOKENS_FULL: "16000"
          HINDSIGHT_PRIVATE_REPO_DIR: ${{ github.workspace }}/hindsight_private
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          MODE: ${{ inputs.mode || 'daily' }}
          TICKER: ${{ inputs.ticker }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          if [ "$MODE" = "sell" ]; then
            if [ -z "$TICKER" ]; then echo "mode=sell needs a ticker" >&2; exit 2; fi
            python -m hindsight sell "$TICKER" $FORCE
          else
            python -m hindsight run --mode "$MODE" $FORCE
          fi

      - name: Publish Harry to the dashboard
        # Public-safe verdict summary only (see hindsight/web.py). ASCII-only
        # commit messages, same rule as the other agents.
        if: always()
        run: |
          if [ ! -f docs/data/harry.json ]; then echo "no harry.json this run"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/harry.json
          git diff --staged --quiet || git commit -m "Harry data [skip ci]"
          git pull --rebase origin HEAD
          python scripts/build_dashboard.py
          git add docs/index.html docs/data/bob_history.json docs/data/slinger_history.json docs/data/us_history.json
          git diff --staged --quiet || git commit -m "Dashboard update -- Harry [skip ci]"
          git push origin HEAD

      - name: Commit private store
        if: always() && env.HINDSIGHT_STORE == 'private_repo'
        working-directory: hindsight_private
        run: |
          if [ ! -d .git ]; then echo "no private checkout, nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -q -m "Harry Hindsight run ${{ github.run_id }}"
          git push -q
