name: Ned Podcast Transcript Fetcher

# Manual, on-demand single-episode podcast transcript fetcher.
# Paste a podcast URL into the "Run workflow" box and Ned will:
#   1. Resolve it (direct .mp3, Apple Podcasts link, or RSS feed URL).
#   2. Download the audio and compress it with ffmpeg to 16 kHz mono Opus.
#   3. Transcribe with the OpenAI Whisper API.
#   4. Summarise with Anthropic (same LLM step Ned already uses).
#   5. Email the digest and upload the raw transcript as an artifact.
#
# Unlike ned_transcript.yml (YouTube), this workflow runs on ubuntu-latest:
#   * YouTube blocks caption fetches from cloud IPs — hence the self-hosted
#     runner there.
#   * Podcast MP3 hosts (CDNs, Libsyn, Simplecast, etc.) do NOT block cloud
#     IPs — normal HTTP downloads work fine, so no home PC is required.
#   * ffmpeg is preinstalled on ubuntu-latest.
#
# Required secrets (all already exist from other workflows except OPENAI_API_KEY):
#   OPENAI_API_KEY     — Whisper API (~$0.006/min ≈ 36c for a 60-min episode)
#   ANTHROPIC_API_KEY  — Ned's existing LLM digest step
#   EMAIL_FROM / EMAIL_TO / EMAIL_APP_PASSWORD — Gmail SMTP

on:
  workflow_dispatch:
    inputs:
      podcast_url:
        description: >
          Podcast episode link (direct .mp3/.m4a URL, Apple Podcasts episode
          URL, or an RSS feed URL — newest episode is used if the RSS URL has
          no episode selector)
        required: true
        type: string

jobs:
  transcript:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify ffmpeg is available
        run: |
          ffmpeg -version | head -1

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ned.txt

      - name: Fetch podcast + transcribe + digest
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Passed via env (not the run: line) so an odd URL can't be shell-injected.
          NED_PODCAST_URL: ${{ inputs.podcast_url }}
        run: |
          python -m ned.main

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ned-podcast-transcripts
          path: transcripts/
          if-no-files-found: ignore
