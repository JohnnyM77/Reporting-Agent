name: Ned Transcript Fetcher

# Manual, on-demand single-episode YouTube transcript fetcher.
# Paste a YouTube link into the "Run workflow" box and Ned will fetch the
# transcript, save it, summarise it with the same LLM step it uses elsewhere,
# and email the digest. The raw transcripts are uploaded as an artifact.
#
# Runs on the SELF-HOSTED Windows runner (mr_co-runer) on purpose: YouTube
# blocks caption requests from cloud/datacentre IPs (GitHub-hosted runners get
# a RequestBlocked/IpBlocked error), whereas the self-hosted runner uses a
# residential IP that YouTube serves normally. The runner's PC must be on and
# the runner process running for a dispatch to start (it queues otherwise).
#
# This is separate from the scheduled "Ned News Agent" scan on purpose: it
# takes an input, runs a different code path, and must not touch the daily
# digest or the Pages deploy.

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube episode link (watch?v=…, youtu.be/…, or /shorts/…)"
        required: true
        type: string

jobs:
  transcript:
    runs-on: [self-hosted, Windows]
    # Needed so the commit step at the end can push docs/data/transcripts.json
    # + the rebuilt docs/index.html back to the branch.
    permissions:
      contents: write
    defaults:
      run:
        # Windows PowerShell 5.1 (invoked as `powershell`) ships with every
        # supported Windows version. `pwsh` refers to PowerShell 7+, which
        # this runner doesn't have installed; `bash` needs Git Bash on PATH,
        # which the runner process can't find. `powershell` is the only
        # shell we can rely on being available.
        shell: powershell

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          # Use the machine's own Python (3.14) rather than setup-python, which
          # would try to populate a tool cache this runner doesn't have.
          $py = "C:\Users\mr_co\AppData\Local\Programs\Python\Python314\python.exe"
          if (-not (Test-Path $py)) {
            # Fall back to whatever "python" resolves to on PATH.
            $py = "python"
          }
          Write-Host "Using Python: $py"
          & $py --version
          & $py -m pip install --upgrade pip
          & $py -m pip install -r requirements-ned.txt

      - name: Fetch transcript + digest
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Passed via env (not the run: line) so an odd URL can't be shell-injected.
          NED_TRANSCRIPT_URL: ${{ inputs.youtube_url }}
        run: |
          $py = "C:\Users\mr_co\AppData\Local\Programs\Python\Python314\python.exe"
          if (-not (Test-Path $py)) { $py = "python" }
          & $py -m ned.main

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ned-transcripts
          path: transcripts/
          if-no-files-found: ignore

      - name: Commit dashboard update
        # Same pattern the other agents use (Bob, Ned scan, Wally): commit
        # the data JSON, pull --rebase to absorb anything that landed while
        # we ran, rebuild the dashboard from the fresh data, and push. Runs
        # even on a fetch failure so a "failed to fetch" partial can still
        # be surfaced if that lands on the dashboard in future.
        if: always()
        run: |
          $py = "C:\Users\mr_co\AppData\Local\Programs\Python\Python314\python.exe"
          if (-not (Test-Path $py)) { $py = "python" }
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if (Test-Path "docs\data\transcripts.json") {
            git add docs/data/transcripts.json
            git diff --staged --quiet
            if ($LASTEXITCODE -ne 0) {
              git commit -m "Ned transcripts data [skip ci]"
            }
            git pull --rebase origin HEAD
            & $py scripts/build_dashboard.py
            git add docs/index.html
            git diff --staged --quiet
            if ($LASTEXITCODE -ne 0) {
              git commit -m "Dashboard update — Ned transcripts [skip ci]"
            }
            git push origin HEAD
          } else {
            Write-Host "No transcripts.json produced this run; nothing to commit."
          }
