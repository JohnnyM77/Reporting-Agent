name: Ned Transcript Fetcher

# Manual, on-demand single-episode YouTube transcript fetcher.
# Paste a YouTube link into the "Run workflow" box and Ned will fetch the
# transcript, save it, summarise it with the same LLM step it uses elsewhere,
# and email the digest. The raw transcripts are uploaded as an artifact.
#
# Runs on the SELF-HOSTED Windows runner (mr_co-runer) on purpose: YouTube
# blocks caption requests from cloud/datacentre IPs (GitHub-hosted runners get
# a RequestBlocked/IpBlocked error), whereas the self-hosted runner uses a
# residential IP that YouTube serves normally. The runner's PC must be on and
# the runner service running for a dispatch to start (it queues otherwise).
#
# This is separate from the scheduled "Ned News Agent" scan on purpose: it
# takes an input, runs a different code path, and must not touch the daily
# digest or the Pages deploy.

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "YouTube episode link (watch?v=…, youtu.be/…, or /shorts/…)"
        required: true
        type: string

jobs:
  transcript:
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        # Git Bash is installed on the runner (see CLAUDE.md) so the same
        # bash steps work as on the cloud runners.
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          # Use the machine's own Python (3.14) rather than setup-python, which
          # would try to populate a tool cache this runner doesn't have.
          PY="python"
          command -v "$PY" >/dev/null 2>&1 || PY="/c/Users/mr_co/AppData/Local/Programs/Python/Python314/python.exe"
          echo "Using Python: $PY"
          "$PY" --version
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install -r requirements-ned.txt

      - name: Fetch transcript + digest
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Passed via env (not the run: line) so an odd URL can't be shell-injected.
          NED_TRANSCRIPT_URL: ${{ inputs.youtube_url }}
        run: |
          PY="python"
          command -v "$PY" >/dev/null 2>&1 || PY="/c/Users/mr_co/AppData/Local/Programs/Python/Python314/python.exe"
          "$PY" -m ned.main

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ned-transcripts
          path: transcripts/
          if-no-files-found: ignore
