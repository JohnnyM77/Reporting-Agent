name: SGX Daily Announcements

# Bob SG V4 Round 2 -- full daily orchestrator.
# Fetches, classifies, analyses (results only), emails.
#
# Runs on the self-hosted Windows runner (mr_co-runer) on purpose: SGX
# blocks non-browser TLS fingerprints and its Flutter Web frontend
# generates a signed authorizationtoken header client-side that only fires
# from a real Chrome UA + real Chrome fingerprint. GH-hosted ubuntu can
# reach investors.sgx.com but not the announcements list endpoint under
# SGX's constraints -- see PR #164 for the diagnosis.

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Optional comma-separated SGX codes (defaults to tickers.yaml sgx section)"
        required: false
        default: ""
      hours_back:
        description: "Window in hours (default 24)"
        required: false
        default: "24"
      dry_run:
        description: "true = build digest + preview but don't send email or update seen state"
        required: false
        default: "false"
      fetch_only:
        description: "true = just run sgx_fetch.py and upload JSON (Round 1 mode); no LLM/email"
        required: false
        default: "false"
  schedule:
    # 00:15 UTC = 08:15 SGT -- ~1h15m after SGX opens (9am SGT), long enough
    # for the ~7am pre-open batch to have landed.
    - cron: "15 0 * * *"

jobs:
  digest:
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        shell: powershell

    # Restore + save seen_state across runs so we don't re-analyse the same
    # announcement two days in a row.
    steps:
      - uses: actions/checkout@v4

      - name: Restore seen state
        uses: actions/cache/restore@v4
        with:
          path: state_seen_sgx.json
          key: sgx-seen-state-${{ github.ref_name }}
          restore-keys: |
            sgx-seen-state-${{ github.ref_name }}-

      - name: Install deps + ensure Chrome
        run: |
          $py = "C:\Users\mr_co\AppData\Local\Programs\Python\Python314\python.exe"
          if (-not (Test-Path $py)) { $py = "python" }
          & $py -m pip install --upgrade pip
          # Full agent deps -- superset of Round 1's fetch-only deps.
          & $py -m pip install playwright pyyaml requests beautifulsoup4 pypdf `
                                anthropic `
                                google-api-python-client google-auth `
                                google-auth-httplib2 google-auth-oauthlib
          & $py -m playwright install chrome
          # install chrome exits non-zero when already present system-wide
          $LASTEXITCODE = 0

      - name: Run Bob SG
        env:
          # Fetch
          SGX_TICKERS_INPUT: ${{ github.event.inputs.tickers }}
          SGX_HOURS_BACK: ${{ github.event.inputs.hours_back }}
          # Email (shared with ASX Bob's daily.yml)
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          # LLM
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
          # Google Drive OAuth (same secrets Bob's ASX path uses)
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          # Optional: a separate Drive folder for SGX analysis Docs so they
          # don't mix with the ASX ones. Set this secret in GH to enable.
          GDRIVE_SGX_ANALYSIS_FOLDER_ID: ${{ secrets.GDRIVE_SGX_ANALYSIS_FOLDER_ID }}
          # Dispatch inputs picked up in-Python
          BOB_SG_DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
          BOB_SG_FETCH_ONLY_INPUT: ${{ github.event.inputs.fetch_only }}
        run: |
          $py = "C:\Users\mr_co\AppData\Local\Programs\Python\Python314\python.exe"
          if (-not (Test-Path $py)) { $py = "python" }

          $fetchOnly = $false
          if ($env:BOB_SG_FETCH_ONLY_INPUT -eq "true") { $fetchOnly = $true }
          $dryRun = $false
          if ($env:BOB_SG_DRY_RUN_INPUT -eq "true") { $dryRun = $true }

          if ($fetchOnly) {
            $args = @("sgx_fetch.py", "--out", "outputs/sgx/announcements.json")
            if ($env:SGX_TICKERS_INPUT) {
              $args += @("--tickers", $env:SGX_TICKERS_INPUT)
            }
            if ($env:SGX_HOURS_BACK) {
              $args += @("--hours-back", $env:SGX_HOURS_BACK)
            }
            & $py @args
          } else {
            $args = @("sgx_agent.py")
            if ($env:SGX_HOURS_BACK) {
              $args += @("--hours-back", $env:SGX_HOURS_BACK)
            }
            if ($dryRun) { $args += "--dry-run" }
            & $py @args
          }

      - name: Save seen state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state_seen_sgx.json
          key: sgx-seen-state-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgx-daily
          path: outputs/sgx/
          if-no-files-found: warn
