name: SGX Spike

# Manual-only. v3 launches headless Chromium against investors.sgx.com and
# records every XHR/fetch the Flutter Web app makes at runtime — the only
# way to see the real API endpoint, since v2 proved it isn't in the HTML.

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "SGX code to probe (default D05 = DBS Group Holdings)"
        required: false
        default: "D05"

jobs:
  probe:
    name: probe (ubuntu-latest, Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps
      - name: Run SGX probe
        env:
          SGX_SPIKE_TICKER: ${{ github.event.inputs.ticker }}
        run: python scripts/sgx_spike.py
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sgx-spike-${{ github.event.inputs.ticker }}
          path: outputs/sgx_spike/
          if-no-files-found: warn
