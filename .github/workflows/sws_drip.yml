name: SWS Drip Bot

on:
  schedule:
    # 23:30 UTC = 09:30 Sydney AEST (post-ASX-open), weekdays only
    - cron: '30 23 * * 1-5'
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Tickers to download right now (comma-separated, e.g. BHP,BXB,WOW). Leave blank to use the queue.'
        default: ''
        type: string
      limit:
        description: 'How many CSVs to pull from the queue (ignored if tickers is set)'
        default: '2'
        type: string
      dry_run:
        description: 'Dry run — print next tickers without downloading'
        default: false
        type: boolean
      rebuild_queue:
        description: 'Rebuild queue from watchlists before downloading'
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  drip:
    # Runs on your home PC (mr_co-runer) — your home IP bypasses Cloudflare
    runs-on: self-hosted
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd  # Windows cmd — no execution policy restrictions

    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: python -m pip install curl-cffi pyyaml

      - name: Rebuild queue (optional)
        if: ${{ github.event.inputs.rebuild_queue == 'true' }}
        run: python -m agents.sws_drip.run_drip --rebuild-queue

      - name: Ensure queue exists
        run: python -m agents.sws_drip.run_drip --rebuild-queue

      - name: Mark stale CSVs for re-download
        run: python -m agents.sws_drip.run_drip --mark-stale --stale-days 180

      # --- Three mutually exclusive run steps (GitHub Actions handles the if logic) ---

      - name: Run SWS drip (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        env:
          SWS_STORAGE_STATE: ${{ secrets.SWS_STORAGE_STATE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m agents.sws_drip.run_drip --dry-run --limit ${{ github.event.inputs.limit || '2' }}

      - name: Run SWS drip (manual tickers)
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.tickers != '' }}
        env:
          SWS_STORAGE_STATE: ${{ secrets.SWS_STORAGE_STATE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m agents.sws_drip.run_drip --tickers ${{ github.event.inputs.tickers }}

      - name: Run SWS drip (queue)
        if: ${{ github.event.inputs.dry_run != 'true' && (github.event.inputs.tickers == '' || github.event_name == 'schedule') }}
        env:
          SWS_STORAGE_STATE: ${{ secrets.SWS_STORAGE_STATE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m agents.sws_drip.run_drip --limit ${{ github.event.inputs.limit || '2' }}

      - name: Commit downloaded CSVs
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sws_csv/
          git diff --staged --quiet && echo "No new CSVs to commit." || (git commit -m "chore(sws): drip download %DATE:~10,4%-%DATE:~4,2%-%DATE:~7,2%" && git push)

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sws-debug-${{ github.run_id }}
          path: data/sws_debug/
          if-no-files-found: ignore
          retention-days: 7
