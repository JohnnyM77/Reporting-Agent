name: SWS Database Import

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-import even if files already imported"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-investing.txt
          pip install google-api-python-client google-auth

      - name: Import SWS CSVs
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python -m investing.import_sws_csv \
            --db /tmp/jm_investing_sws.sqlite \
            $FORCE_FLAG \
            investing/tests/fixtures/
          # Verify only the consolidated .sqlite exists (no WAL/SHM sidecars)
          python -c "
          import sqlite3
          from pathlib import Path
          db = Path('/tmp/jm_investing_sws.sqlite')
          con = sqlite3.connect(db)
          con.execute('PRAGMA wal_checkpoint(TRUNCATE)')
          con.close()
          for sidecar in [db.with_suffix('.sqlite-wal'), db.with_suffix('.sqlite-shm')]:
              if sidecar.exists():
                  sidecar.unlink()
                  print(f'Removed sidecar: {sidecar.name}')
          print(f'DB size: {db.stat().st_size:,} bytes')
          assert not db.with_suffix('.sqlite-wal').exists(), 'WAL file still present!'
          print('Clean single-file SQLite confirmed.')
          "

      - name: Upload SQLite to Google Drive
        continue-on-error: true
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python - <<'EOF'
          import json, os, sys
          from pathlib import Path

          client_id     = os.environ.get("GDRIVE_CLIENT_ID", "").strip()
          client_secret = os.environ.get("GDRIVE_CLIENT_SECRET", "").strip()
          refresh_token = os.environ.get("GDRIVE_REFRESH_TOKEN", "").strip()
          folder_id     = os.environ.get("GDRIVE_FOLDER_ID", "").strip()

          if not (client_id and client_secret and refresh_token and folder_id):
              print("GDrive OAuth secrets not configured — skipping upload.")
              print("Set GDRIVE_CLIENT_ID, GDRIVE_CLIENT_SECRET, GDRIVE_REFRESH_TOKEN, GDRIVE_FOLDER_ID.")
              sys.exit(0)

          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          creds = Credentials(
              token=None,
              refresh_token=refresh_token,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=client_id,
              client_secret=client_secret,
              scopes=["https://www.googleapis.com/auth/drive"],
          )
          creds.refresh(Request())
          service = build("drive", "v3", credentials=creds)

          db_path = Path("/tmp/jm_investing_sws.sqlite")
          media = MediaFileUpload(str(db_path), mimetype="application/x-sqlite3", resumable=False)

          results = service.files().list(
              q=f"name='jm_investing_sws.sqlite' and '{folder_id}' in parents and trashed=false",
              fields="files(id,name)"
          ).execute()
          existing = results.get("files", [])

          if existing:
              file_id = existing[0]["id"]
              service.files().update(fileId=file_id, media_body=media).execute()
              print(f"Updated: https://drive.google.com/file/d/{file_id}/view")
          else:
              created = service.files().create(
                  body={"name": "jm_investing_sws.sqlite", "parents": [folder_id]},
                  media_body=media,
                  fields="id"
              ).execute()
              file_id = created["id"]
              print(f"Created: https://drive.google.com/file/d/{file_id}/view")
          EOF
