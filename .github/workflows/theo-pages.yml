name: Publish site

# The one and only publisher of GitHub Pages for this repo. A Pages deploy
# replaces the whole site at once, so the dashboard at / and Theo's slides at
# /theo/ have to be built and uploaded together by a single workflow — a second
# workflow deploying either half on its own would delete the other.
#
# `check` runs before the build: a malformed thesis fails the run rather than
# publishing a slide with a hole in it.

on:
  # A thesis, the code that renders one, the ledger, or the shared dashboard
  # changed on main.
  push:
    branches: [main]
    paths:
      - "theses/**"
      - "theo/**"
      - "data/**"
      - "docs/**"
      - "scripts/build_dashboard.py"
      - ".github/workflows/theo-pages.yml"

  # An agent finished its run. Each of them writes its own docs/data/*.json,
  # rebuilds docs/index.html and pushes the result with [skip ci] — which is
  # exactly what stops that push from triggering anything, this workflow
  # included. For weeks that meant the agents kept updating docs/index.html in
  # git while the deployed site stayed frozen at whatever the last thesis
  # change had published: Bob ran, the email arrived, the website did not move.
  #
  # So the deploy hangs off the agent run itself rather than off its commit.
  # Bob and Ned every morning, Wally on Saturday, Sally on Sunday.
  #
  # Deliberately not gated on the triggering run succeeding. A run that emailed
  # its digest and then tripped over on a later step has still committed data
  # worth publishing, and re-deploying unchanged content costs nothing.
  workflow_run:
    workflows:
      - "Daily Announcement Digest"    # Bob   — daily,  23:13 UTC
      - "Ned News Agent"               # Ned   — daily,  23:30 UTC
      - "Wally Watchlist Screening"    # Wally — Friday, 22:30 UTC
      - "Selling Sally Weekly Review"  # Sally — Sunday, 00:00 UTC
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      show_amounts:
        description: "Include dollar amounts in the published site (default: suppressed)"
        type: boolean
        required: false
        default: false

# Only one Pages deploy at a time; a queued run supersedes the one behind it.
# Bob and Ned finish within a couple of minutes of each other most mornings,
# so the second one cancelling the first is the intended outcome — the survivor
# publishes the newer data.
concurrency:
  group: publish-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # `push` gives us the branch in github.ref_name; `workflow_run` sets
      # github.ref to the default branch and carries the real one on the event.
      TARGET_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # On workflow_run, github.sha is the default branch's tip as of when
          # the event fired, which can predate the agent's own dashboard commit
          # made moments earlier in the run that triggered us. Checking the
          # branch out by name always picks up the newest data.
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml jinja2 openpyxl

      - name: Validate every thesis
        run: python -m theo.cli check

      - name: Run Theo's tests
        run: python tests/test_theo.py

      - name: Build the site
        run: |
          python -m theo.cli publish ${{ inputs.show_amounts && '--show-amounts' || '' }}

      # Theo's row on the combined agent dashboard. Same pattern the other
      # agents use: write your own JSON, rebuild the shared HTML, commit both
      # with [skip ci] so this push does not re-trigger this workflow.
      - name: Update the combined dashboard
        run: |
          python -m theo.cli dashboard
          python scripts/build_dashboard.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/theo.json docs/index.html
          git diff --staged --quiet || git commit -m "Theo data + dashboard [skip ci]"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin HEAD:"$TARGET_BRANCH"

      # The Pages root already belongs to the existing agent dashboard in
      # docs/. Publishing Theo over the top of it would take that URL away, so
      # the artifact keeps docs/ at the root and mounts Theo at /theo/.
      # docs/ is only read here, never written.
      - name: Stage the Pages artifact
        run: |
          mkdir -p _pages/theo
          if [ -d docs ]; then cp -r docs/. _pages/; fi
          cp -r site/. _pages/theo/
          touch _pages/.nojekyll
          find _pages -maxdepth 2 -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
