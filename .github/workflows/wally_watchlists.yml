name: Wally Watchlist Screening

on:
  workflow_dispatch:
  schedule:
    # Fri 22:30 UTC = Sat 06:30 SGT — all watchlists including TII75 run every
    # scheduled execution. Wally produces a lot of material in one go, so it
    # runs once a week rather than twice, and lands on a Saturday morning
    # where there is time to read it. Was Tue+Fri ("30 22 * * 2,5").
    - cron: "30 22 * * 5"

jobs:
  wally:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-wally.txt
          # Playwright is the stage-2 fallback for ASX announcement fetches
          # (asx_fetch.py) when the direct HTTP path is blocked for runner IPs.
          pip install playwright
          playwright install chromium --with-deps

      - name: Download SWS database from Google Drive
        continue-on-error: true
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_INVESTING_FOLDER_ID: ${{ secrets.GDRIVE_INVESTING_FOLDER_ID }}
        run: |
          python - <<'EOF'
          import io, json, os, sys
          from pathlib import Path

          client_id     = os.environ.get("GDRIVE_CLIENT_ID", "").strip()
          client_secret = os.environ.get("GDRIVE_CLIENT_SECRET", "").strip()
          refresh_token = os.environ.get("GDRIVE_REFRESH_TOKEN", "").strip()
          folder_id     = os.environ.get("GDRIVE_INVESTING_FOLDER_ID", "").strip()

          if not (client_id and client_secret and refresh_token and folder_id):
              print("GDrive OAuth secrets not set — skipping SWS DB download. Wally will use yfinance fallback.")
              sys.exit(0)

          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaIoBaseDownload

          creds = Credentials(
              token=None, refresh_token=refresh_token,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=client_id, client_secret=client_secret,
              scopes=["https://www.googleapis.com/auth/drive"],
          )
          creds.refresh(Request())
          service = build("drive", "v3", credentials=creds)

          results = service.files().list(
              q=f"name='jm_investing_sws.sqlite' and '{folder_id}' in parents and trashed=false",
              fields="files(id,name,size)"
          ).execute()
          files = results.get("files", [])
          if not files:
              print("jm_investing_sws.sqlite not found in Investing folder — skipping.")
              sys.exit(0)

          file_id = files[0]["id"]
          dest = Path("jm_investing_sws.sqlite")
          request = service.files().get_media(fileId=file_id)
          with io.FileIO(str(dest), "wb") as fh:
              downloader = MediaIoBaseDownload(fh, request)
              done = False
              while not done:
                  _, done = downloader.next_chunk()
          print(f"Downloaded jm_investing_sws.sqlite ({dest.stat().st_size:,} bytes)")
          EOF

      - name: Run all watchlists with combined email
        env:
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SWS_DB_PATH: jm_investing_sws.sqlite
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger: run all with combined email (force TII75)
            python -m wally.main --all-combined --force
          else
            # Scheduled run (weekly, Fri UTC): all watchlists including TII75
            python -m wally.main --all-combined
          fi

      - name: Commit fundamentals cache
        if: always()
        run: |
          git config user.name "Wally Bot"
          git config user.email "wally-bot@reporting-agent.local"
          git add fundamentals/ || true
          git diff --staged --quiet || git commit -m "chore(fundamentals): update cache [$(date -u +%Y-%m-%d)]"
          git push || echo "Nothing to push"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit dashboard update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Commit only Wally's data JSON — no conflict possible with other agents
          git add docs/data/wally.json
          git diff --staged --quiet || git commit -m "Wally data [skip ci]"
          # Pull other agents' latest JSON files
          git pull --rebase origin HEAD
          # Rebuild HTML with all agents' combined data, then push
          python scripts/build_dashboard.py
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Dashboard update — Wally [skip ci]"
          git push origin HEAD
