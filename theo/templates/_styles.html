{# Theo slide styles.

   Flat and print-first on purpose: no gradients, no shadows, no rounded
   flourishes. The slide is screenshotted at 3x and may end up on paper, so
   everything is hairline rules and solid tints that survive both. #}
<style>
  :root {
    --ink:      #111418;
    --ink-soft: #4a5058;
    --ink-mute: #838b95;
    --rule:     #d6dae0;
    --rule-firm:#9aa2ac;
    --paper:    #ffffff;
    --tint:     #f4f2ec;
    --intact:   #1f7a4d;
    --strained: #b06a12;
    --breached: #a8261f;
    --kill:     #a8261f;
    --alert:    #a8261f;
    --warn:     #b06a12;
    --clean:    #1f7a4d;
    --slide-w:  1123px;
    --slide-h:  794px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #e9eaec;
    color: var(--ink);
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .slide {
    width: var(--slide-w);
    height: var(--slide-h);
    background: var(--paper);
    padding: 24px 30px 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* ---------- header ---------- */

  .hdr {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 8px;
  }
  .hdr-left { display: flex; align-items: baseline; gap: 12px; min-width: 0; flex: 1 1 auto; }
  .ticker {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .coname {
    font-size: 15px;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; flex: 0 1 auto; max-width: 66%; }
  .tag {
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 3px 7px;
    border: 1px solid var(--rule-firm);
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .tag.kind   { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tag.draft  { background: var(--warn); color: #fff; border-color: var(--warn); }
  .tag.exited { background: var(--breached); color: #fff; border-color: var(--breached); }

  /* ---------- the bet ---------- */

  .bet {
    margin-top: 12px;
    background: var(--tint);
    border-left: 3px solid var(--ink);
    padding: 10px 14px;
  }
  .bet-label {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-mute);
    margin-bottom: 5px;
  }
  .bet-text {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    font-size: 14.5px;
    line-height: 1.36;
    color: var(--ink);
  }

  /* ---------- drift banner ---------- */

  .drift {
    margin-top: 10px;
    border: 1px solid var(--rule-firm);
    border-left-width: 3px;
    padding: 6px 11px;
    display: flex;
    gap: 12px;
    align-items: baseline;
  }
  .drift.DRIFTING { border-left-color: var(--alert); }
  .drift.WATCH    { border-left-color: var(--warn); }
  .drift.CLEAN    { border-left-color: var(--clean); }
  .drift-verdict {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .drift.DRIFTING .drift-verdict { color: var(--alert); }
  .drift.WATCH    .drift-verdict { color: var(--warn); }
  .drift.CLEAN    .drift-verdict { color: var(--clean); }
  .drift-list {
    font-size: 10px;
    line-height: 1.4;
    max-height: 42px;
    color: var(--ink-soft);
    overflow: hidden;
  }
  .drift-list b { color: var(--ink); font-weight: 600; }

  /* ---------- body columns ---------- */

  /* The columns are hard-clipped. A slide is one page: if a thesis outgrows
     the box the fix is to write less on the slide, not to let it bleed over
     the metric strip. */
  .cols {
    margin-top: 11px;
    display: flex;
    gap: 18px;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
  }
  .col-l { flex: 1 1 55%; min-width: 0; display: flex; flex-direction: column; gap: 7px; overflow: hidden; }
  .col-r { flex: 1 1 45%; min-width: 0; display: flex; flex-direction: column; gap: 9px; overflow: hidden; }

  .sec-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-mute);
    border-bottom: 1px solid var(--rule);
    padding-bottom: 3px;
    margin-bottom: 6px;
  }

  /* ---------- pillars ---------- */

  .pillar {
    border: 1px solid var(--rule);
    border-left: 4px solid var(--rule-firm);
    padding: 6px 10px 7px;
  }
  .pillar.INTACT   { border-left-color: var(--intact); }
  .pillar.STRAINED { border-left-color: var(--strained); }
  .pillar.BREACHED { border-left-color: var(--breached); background: #fbf4f3; }

  .pillar-head { display: flex; align-items: baseline; gap: 7px; }
  .pillar-id {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--ink-mute);
  }
  .pillar-claim { font-size: 11.5px; font-weight: 600; line-height: 1.3; flex: 1; }
  .pillar-status {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .pillar.INTACT   .pillar-status { color: var(--intact); }
  .pillar.STRAINED .pillar-status { color: var(--strained); }
  .pillar.BREACHED .pillar-status { color: var(--breached); }

  .pillar-evidence {
    margin-top: 3px;
    font-size: 9.8px;
    line-height: 1.36;
    color: var(--ink-soft);
  }
  .pillar-kill {
    margin-top: 5px;
    padding-top: 4px;
    border-top: 1px dotted var(--rule-firm);
    font-size: 9.8px;
    line-height: 1.34;
    color: var(--kill);
  }
  .pillar-kill b {
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-size: 9px;
  }

  /* ---------- right column blocks ---------- */

  .block { }
  .block-body { font-size: 10.2px; line-height: 1.4; color: var(--ink-soft); }
  .block-body b { color: var(--ink); }

  table.dec { width: 100%; border-collapse: collapse; font-size: 10.5px; }
  table.dec th {
    text-align: right;
    font-weight: 600;
    color: var(--ink-mute);
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0 0 3px;
    border-bottom: 1px solid var(--rule);
  }
  table.dec th:first-child, table.dec td:first-child { text-align: left; }
  table.dec td {
    text-align: right;
    padding: 4px 0;
    border-bottom: 1px solid var(--rule);
    font-variant-numeric: tabular-nums;
  }
  table.dec tr:last-child td { border-bottom: none; }
  table.dec td.scrip { color: var(--ink-mute); font-style: italic; }
  .no-ledger {
    font-size: 10.5px;
    line-height: 1.45;
    color: var(--ink-mute);
    border: 1px dashed var(--rule-firm);
    padding: 7px 10px;
  }

  /* ---------- metric strip ---------- */

  .strip {
    margin-top: 11px;
    flex: 0 0 auto;
    display: flex;
    border-top: 2px solid var(--ink);
    border-bottom: 1px solid var(--rule);
  }
  .metric {
    flex: 1 1 20%;
    padding: 7px 12px 7px 0;
    border-right: 1px solid var(--rule);
  }
  .metric:last-child { border-right: none; padding-right: 0; }
  .metric:not(:first-child) { padding-left: 12px; }
  .metric-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }
  .metric-value {
    margin-top: 2px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .metric-value.muted { color: var(--ink-mute); font-weight: 600; }
  /* A horizon like "Until the kill conditions are written properly" is a
     sentence, not a figure — drop it to body size rather than let it
     overrun the strip. */
  .metric-value.long { font-size: 11.5px; line-height: 1.3; font-weight: 600; }
  .metric-note { font-size: 9.5px; color: var(--ink-mute); margin-top: 1px; }

  /* ---------- footer ---------- */

  .ftr {
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px solid var(--rule);
    display: flex;
    gap: 16px;
    font-size: 9px;
    line-height: 1.38;
    color: var(--ink-mute);
    flex: 0 0 auto;
    max-height: 96px;
    overflow: hidden;
  }
  .ftr div { flex: 1 1 0; min-width: 0; }
  .ftr b {
    display: block;
    font-size: 8.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-mute);
    margin-bottom: 2px;
  }
  .ftr span { color: var(--ink-soft); }

  @media print {
    html, body { background: #fff; }
    .slide { page-break-after: always; }
  }
</style>
