# Per-ticker buy ("target") prices — a ticker is flagged when its current price
# falls at or below its buy price, in addition to the 52-week-low proximity flag.
# Sourced from config/tii_portfolio_targets.yaml (buy_below). Only tickers with a
# numeric buy price in the reporter's own quote currency are listed here; GBX
# (pence) names — AUTO, LSEG, RMV — are intentionally omitted to avoid a false
# below-target flag from a currency/unit mismatch.
